# On a `v*` tag push, build dido binaries for each (OS, arch) and
# attach them to a GitHub Release. Each archive holds a `go-aeneas`
# binary plus LICENSE and espeak-ng data and binaries.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label baked into the archive name (e.g. v0.1.0-dev)"
        required: true
        default: v0.1.0-dev

permissions:
  contents: write

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # lipo + codesign need to run on a real macOS runner.
          - os: darwin
            arch: universal
            runner: macos-14
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install espeak-ng (macOS)
        if: matrix.os == 'darwin'
        run: brew update && brew install espeak-ng

      - name: Build darmin/arm64
        if: matrix.os == 'darwin'
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p stage/darwin
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.tag }}" \
          -o stage/darwin/dido-${{ env.GOARCH }} ./cmd/dido

      - name: Build darmin/arm64
        if: matrix.os == 'darwin'
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p stage/darwin
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.tag }}" \
          -o stage/darwin/dido-${{ env.GOARCH }} ./cmd/dido

      - name: Stage darwin artifact
        if: matrix.os == 'darwin'
        run: |
          mkdir -p stage/darwin-universal
          lipo -create stage/darwin/dido-arm64 stage/darwin/dido-amd64 -output stage/darwin-universal/dido
          cp LICENSE stage/darwin-universal/
          BREW_PREFIX="$(brew --prefix)"
          cp -RL "$BREW_PREFIX/share/espeak-ng-data" stage/darwin-universal/
          cp -L "$BREW_PREFIX/bin/espeak-ng" stage/darwin-universal/
          cp -L "$BREW_PREFIX"/lib/libespeak-ng*.dylib stage/darwin-universal/
          cp -L "$BREW_PREFIX"/lib/libpcaudio*.dylib stage/darwin-universal/
          ARCHIVE="dido_${{ needs.prepare.outputs.tag }}_darwin_universal.tar.gz"
          tar -C stage/darwin-universal -czf "$ARCHIVE" .
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Build linux
        if: matrix.os == 'linux'
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p stage/linux-${{ matrix.arch }}
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.tag }}" \
            -o stage/linux-${{ matrix.arch }}/dido ./cmd/dido
          cp LICENSE stage/linux-${{ matrix.arch }}/
          ARCHIVE="dido_${{ needs.prepare.outputs.tag }}_linux_${{ matrix.arch }}.tar.gz"
          tar -C stage/linux-${{ matrix.arch }} -czf "$ARCHIVE" .
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Install espeak-ng and 7zip (Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          choco install -y espeak-ng
          choco install -y 7zip
          if exist "%ProgramFiles%\eSpeak NG\espeak-ng.exe" (
            echo espeak-ng found at %ProgramFiles%\eSpeak NG
          ) else (
            echo ERROR: espeak-ng not found at expected location
            exit /b 1
          )

      - name: Build windows/amd64
        if: matrix.os == 'windows'
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p stage/windows-amd64
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.tag }}" \
            -o stage/windows-amd64/dido.exe ./cmd/dido
          cp LICENSE stage/windows-amd64/
          ESPEAK_PREFIX="/c/Program Files/eSpeak NG"
          cp -R "$ESPEAK_PREFIX/espeak-ng-data" stage/windows-amd64
          cp "$ESPEAK_PREFIX/espeak-ng.exe" stage/windows-amd64
          cp "$ESPEAK_PREFIX"/libespeak-ng*.dll stage/windows-amd64
          ARCHIVE="dido_${{ needs.prepare.outputs.tag }}_windows_amd64.zip"
          (cd stage/windows-amd64 && 7z a -tzip -r "../../$ARCHIVE" .)
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
